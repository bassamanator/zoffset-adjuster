[package]
name = "zoffset-adjuster"
version = "0.7.1"
edition = "2024"
license-file = "LICENSE.md"
repository = "https://github.com/bassamanator/zoffset-adjuster"
description = "Surgically injects Z offset corrections directly into your gcode."
keywords = ["3d_printing", "3d_printer", "gcode", "klipper"]

[dependencies]
inquire = "0.9.4"
colorize = "0.1.0"
chrono = "0.4.44"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
env_logger = "0.11.10"
log = "0.4.29"
